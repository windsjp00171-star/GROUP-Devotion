<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}恩典少年 · 一起讀這段{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌼</text></svg>">

  <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
  <meta name="theme-color" content="#FAF2E0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="一起讀這段">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icon-192-maskable.png') }}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Serif+TC:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="frame" data-tour-target="{% block tour_key %}home{% endblock %}">
    <button class="tour-btn" type="button" data-tour aria-label="重新看一次導覽">?</button>
    {% if current_user %}
    <div class="account-links">
      {% if current_user_is_admin %}
      <a class="logout-link" href="{{ url_for('admin') }}">後台</a>
      {% endif %}
      <a class="logout-link" href="{{ url_for('my_reflections') }}">我的領受</a>
      <a class="logout-link" href="{{ url_for('history') }}">回顧</a>
      <a class="logout-link" href="{{ url_for('settings') }}">暱稱</a>
      <a class="logout-link" href="{{ url_for('auth.logout') }}">登出</a>
    </div>
    {% endif %}

    {% block content %}{% endblock %}
  </div>

  <script id="reaction-kinds" type="application/json">{{ reaction_kinds | tojson }}</script>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  <script src="{{ url_for('static', filename='js/tour.js') }}"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('{{ url_for("service_worker") }}');
      });
    }
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
