{% extends "base.html" %}

{% block title %}排今天這段{% endblock %}
{% block tour_key %}admin{% endblock %}

{% block content %}
<div class="screen">

  <header class="home-header">
    <p class="eyebrow">輔導後台</p>
    <h1>排今天這段</h1>
  </header>

  {% if saved %}
  <div class="submitted-banner">
    <span class="seed-dot" aria-hidden="true"></span>
    <p>排好了，小組現在打開就看得到</p>
  </div>
  {% endif %}

  <section class="passage-card">
    <form class="admin-form" method="post" action="{{ url_for('admin') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label class="admin-label" for="reference">出處（例如：路加福音 24:13–17 · 以馬忤斯路上）</label>
      <input class="admin-input" type="text" id="reference" name="reference" required
             value="{{ passage.reference if passage else '' }}">

      <label class="admin-label" for="verses">經文（一行一句，不要逐節切碎，一段就好）</label>
      <textarea class="admin-textarea" id="verses" name="verses" rows="6" required>{{ (passage.verses | join('\n')) if passage else '' }}</textarea>

      <label class="admin-label" for="guiding_question">引導問題（低門檻、非考題，例如「哪一句話，也讓你想停下腳步？」）</label>
      <input class="admin-input" type="text" id="guiding_question" name="guiding_question"
             placeholder="哪一句話，也讓你想停下腳步？"
             value="{{ passage.guiding_question if passage else '' }}">

      <label class="admin-label" for="leader_note">你自己想先留的一句（種頭香，打開時底下就不是空的）</label>
      <textarea class="admin-textarea" id="leader_note" name="leader_note" rows="3"
                placeholder="不寫也可以，但寫一句會讓第一個打開的人不孤單"></textarea>

      <button type="submit" class="btn btn--primary">排定今天這段</button>
    </form>
  </section>

  <a class="link-quiet" href="{{ url_for('home') }}">回到今天這段</a>

</div>
{% endblock %}
