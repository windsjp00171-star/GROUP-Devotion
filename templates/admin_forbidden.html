{% extends "base.html" %}

{% block title %}沒有權限{% endblock %}

{% block content %}
<div class="screen screen--center">
  <div class="mascot mascot--small" aria-hidden="true">
    <span class="mascot__ear mascot__ear--l"></span>
    <span class="mascot__ear mascot__ear--r"></span>
    <span class="mascot__face"></span>
    <span class="mascot__eye mascot__eye--l"></span>
    <span class="mascot__eye mascot__eye--r"></span>
    <span class="mascot__cheek mascot__cheek--l"></span>
    <span class="mascot__cheek mascot__cheek--r"></span>
  </div>
  <p class="empty-state">這裡是輔導排經文的地方，你目前還不是這個小組的輔導。</p>
  {% if user and user.line_user_id %}
  <p class="empty-state" style="font-size:12px;">如果你應該是輔導：把這串貼給維護者加進 ADMIN_LINE_USER_IDS——<br><code>{{ user.line_user_id }}</code></p>
  {% endif %}
  <a class="link-quiet" href="{{ url_for('home') }}">回到今天這段</a>
</div>
{% endblock %}
